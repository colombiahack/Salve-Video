name: Compilación APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

env:
  APP_NAME: Salve-Video

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Preparar proyecto
        run: |
          if [ ! -d app ]; then
            unzip -q SalveTools.zip -d _tmp
            cp -r _tmp/*/app ./app
          fi
          sed -i "s|>SaveTools<|>${APP_NAME}<|" app/src/main/res/values/strings.xml

      - name: Compilar
        run: gradle assembleDebug --no-daemon

      - name: Nombrar APK
        id: apk
        run: |
          VERSION=$(grep versionName app/build.gradle.kts | head -1 | tr -dc '0-9.')
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/${APP_NAME}-v${VERSION}.apk
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-apk
          path: dist/*.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          name: ${{ env.APP_NAME }} v${{ steps.apk.outputs.version }}
          files: dist/*.apk
