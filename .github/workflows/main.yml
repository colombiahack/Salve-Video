name: Compilación APK
on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  APP_NAME: "Salve-Video"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Preparar proyecto
        run: |
          if [ ! -d app ]; then
            unzip -q SalveTools.zip -d _tmp
            APPDIR=$(dirname "$(find _tmp -type f -path '*/app/build.gradle.kts' | head -n1)")
            cp -r "$APPDIR" ./app
          fi
          sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">${APP_NAME}</string>|" app/src/main/res/values/strings.xml

      - name: Compilar
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-apk
          path: app/build/outputs/apk/debug/*.apk
