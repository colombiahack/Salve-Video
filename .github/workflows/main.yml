name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  APP_NAME: "Salve-Video"   # nombre que verá el usuario en el móvil

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Preparar proyecto
        run: |
          if [ ! -d app ]; then
            unzip -q SaveTools.zip -d _tmp
            cp -r _tmp/SaveTools/app ./app
          fi
          sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">${APP_NAME}</string>|" app/src/main/res/values/strings.xml
      - name: Compilar
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-apk
          path: app/build/outputs/apk/debug/*.apk
